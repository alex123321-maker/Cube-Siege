name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.1"
  GODOT_RELEASE_URL: "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip"
  GODOT_BIN: "/usr/local/bin/godot"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SCONS_CACHE: "/home/runner/.scons_cache"
  SCONS_CACHE_LIMIT: "4096"
  VERIFY_TIMEOUT_SCONS: "600"

jobs:
  verify:
    name: Build & Verify (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SCons and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons

      - name: Cache SCons Build Artifacts
        id: cache-scons
        uses: actions/cache@v4
        with:
          path: /home/runner/.scons_cache
          key: scons-linux-${{ hashFiles('godot-cpp/**', 'src/**', 'extension_api.json', 'SConstruct') }}
          restore-keys: |
            scons-linux-

      - name: Cache Godot Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Download & Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q ${{ env.GODOT_RELEASE_URL }} -O godot.zip
          unzip -q godot.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm godot.zip

      - name: Verify Godot Installation
        run: godot --version

      - name: Run Authoritative Verification Runner (tools/verify.py)
        run: |
          python tools/verify.py
